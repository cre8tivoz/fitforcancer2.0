<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#faf7f2"/>
      <stop offset="100%" style="stop-color:#e8e2d5"/>
    </linearGradient>
    <linearGradient id="glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#f0eadb"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg)" rx="8"/>
  <!-- Glass outline -->
  <rect x="200" y="100" width="200" height="220" rx="12" fill="url(#glass)" stroke="#d4cdb8" stroke-width="2"/>
  <!-- Milk fill -->
  <rect x="208" y="160" width="184" height="152" rx="8" fill="#faf5e8"/>
  <rect x="208" y="160" width="184" height="152" rx="8" fill="white" opacity="0.3"/>
  <!-- Milk surface line -->
  <line x1="208" y1="160" x2="392" y2="160" stroke="#e8dcc8" stroke-width="1.5"/>
  <!-- Heat lines -->
  <path d="M240 140 Q260 120 280 140" fill="none" stroke="#d4cdb8" stroke-width="1.5" opacity="0.6"/>
  <path d="M290 135 Q310 115 330 135" fill="none" stroke="#d4cdb8" stroke-width="1.5" opacity="0.6"/>
  <path d="M340 140 Q360 120 380 140" fill="none" stroke="#d4cdb8" stroke-width="1.5" opacity="0.6"/>
  <!-- Spoon handle -->
  <line x1="420" y1="200" x2="460" y2="280" stroke="#c0c0c0" stroke-width="4" stroke-linecap="round"/>
  <ellipse cx="410" cy="190" rx="20" ry="12" fill="#c0c0c0" transform="rotate(-15 410 190)"/>
  <!-- Label text -->
  <text x="300" y="370" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#6b7280">Fortified Milky Drink</text>
</svg>
