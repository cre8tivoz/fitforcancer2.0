<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">How ATHENA works</title>
  <desc id="desc">A flow from the user to ATHENA, then either direct conversation or Fit For Cancer owned Movement and Nutrition selection.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="1200" height="520" rx="32" fill="#f8fafc"/>
  <g font-family="Inter, Arial, sans-serif" text-anchor="middle">
    <rect x="60" y="190" width="210" height="110" rx="24" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="165" y="236" font-size="24" font-weight="700" fill="#0f172a">You talk to</text>
    <text x="165" y="268" font-size="24" font-weight="700" fill="#0f172a">ATHENA</text>

    <line x1="270" y1="245" x2="365" y2="245" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>

    <rect x="390" y="175" width="270" height="140" rx="24" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="525" y="226" font-size="23" font-weight="700" fill="#0f172a">ATHENA understands</text>
    <text x="525" y="258" font-size="23" font-weight="700" fill="#0f172a">what you need</text>

    <line x1="660" y1="245" x2="750" y2="245" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>

    <rect x="780" y="55" width="350" height="105" rx="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="955" y="96" font-size="21" font-weight="700" fill="#0f172a">Conversation or information</text>
    <text x="955" y="128" font-size="20" fill="#475569">ATHENA replies</text>

    <rect x="780" y="207" width="350" height="105" rx="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="955" y="248" font-size="21" font-weight="700" fill="#0f172a">Movement</text>
    <text x="955" y="280" font-size="20" fill="#475569">Fit For Cancer chooses the item</text>

    <rect x="780" y="359" width="350" height="105" rx="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="955" y="400" font-size="21" font-weight="700" fill="#0f172a">Nutrition</text>
    <text x="955" y="432" font-size="20" fill="#475569">Fit For Cancer chooses the recipe</text>

    <path d="M750 245 C750 108 760 108 780 108" fill="none" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>
    <path d="M750 245 L780 260" fill="none" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>
    <path d="M750 245 C750 412 760 412 780 412" fill="none" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>
  </g>
</svg>