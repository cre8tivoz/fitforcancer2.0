<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Fit For Cancer privacy boundary</title>
  <desc id="desc">Energy Bank history stays in the browser, ATHENA questions and current fatigue and cancer context pass through the Fit For Cancer server to the AI provider, and anonymous usage events go separately to GoatCounter.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="1200" height="620" rx="32" fill="#f8fafc"/>
  <g font-family="Inter, Arial, sans-serif" text-anchor="middle">
    <rect x="420" y="55" width="360" height="95" rx="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="600" y="113" font-size="26" font-weight="700" fill="#0f172a">Your browser</text>

    <line x1="500" y1="150" x2="285" y2="245" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>
    <line x1="600" y1="150" x2="600" y2="235" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>
    <line x1="700" y1="150" x2="915" y2="245" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>

    <rect x="70" y="270" width="360" height="150" rx="24" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="2"/>
    <text x="250" y="324" font-size="22" font-weight="700" fill="#0f172a">Energy Bank history</text>
    <text x="250" y="358" font-size="20" fill="#475569">stays on your device</text>

    <rect x="420" y="260" width="360" height="170" rx="24" fill="#f0f9ff" stroke="#bae6fd" stroke-width="2"/>
    <text x="600" y="310" font-size="21" font-weight="700" fill="#0f172a">ATHENA question + current</text>
    <text x="600" y="342" font-size="21" font-weight="700" fill="#0f172a">fatigue / cancer context</text>
    <text x="600" y="384" font-size="19" fill="#475569">Fit For Cancer server</text>

    <rect x="790" y="270" width="340" height="150" rx="24" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="2"/>
    <text x="960" y="324" font-size="22" font-weight="700" fill="#0f172a">Anonymous usage events</text>
    <text x="960" y="358" font-size="20" fill="#475569">GoatCounter</text>

    <line x1="600" y1="430" x2="600" y2="495" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>

    <rect x="440" y="515" width="320" height="70" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="600" y="558" font-size="22" font-weight="700" fill="#0f172a">AI provider</text>
  </g>
</svg>